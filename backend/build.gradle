plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    // io.spring.dependency-management 플러그인은 최신 Gradle(9.x)과 호환성 문제가 있어 제외했습니다.
    // 대신 Gradle 내장 platform(BOM) 기능으로 버전을 관리합니다.
}

group = 'com.pricecompare'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot BOM을 platform으로 가져와서 각 스타터의 버전을 자동 관리합니다.
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.3.5')
    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:3.3.5')
    testImplementation platform('org.springframework.boot:spring-boot-dependencies:3.3.5')

    // Web (REST API 전용, Thymeleaf 미포함 - React 프론트와 분리)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux' // WebClient 사용을 위해 포함

    // DB / JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Excel export (추후 필요시 사용)
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    // 네이버쇼핑 HTML 크롤링용
    implementation 'org.jsoup:jsoup:1.18.1'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}